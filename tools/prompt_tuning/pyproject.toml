[project]
name = "afn-prompt-tuning"
version = "0.1.0"
description = "Offline GEPA tuning of the extraction instructions in backend/agenda_first_notes/prompts.py. Never part of the app."
requires-python = ">=3.12"
dependencies = [
    "agenda-first-notes",
    "dspy==3.4.1",
    "gepa==0.1.4",  # ships with dspy 3.4.1; imported directly for the custom adapter
]

[project.scripts]
tune = "prompt_tuning.cli:tune_main"
score = "prompt_tuning.cli:score_main"

[tool.uv]
# Keep litellm off the machine: dspy 3.4.1 imports without it and this tool never calls a dspy/litellm LM.
override-dependencies = ["litellm; sys_platform == 'never'"]

[tool.uv.sources]
agenda-first-notes = { path = "../../backend", editable = true }

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["prompt_tuning"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N"]
ignore = ["S101", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
files = ["prompt_tuning", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
